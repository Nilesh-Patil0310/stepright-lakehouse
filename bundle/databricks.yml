bundle:
  name: stepright-lakehouse

include:
  - resources/ingestion_pipeline.yml
  - resources/transformation_pipeline.yml
  - resources/orchestration_job.yml
  - resources/dq_dashboard.yml
  - resources/environment_bootstrap_job.yml


sync:
  paths:
    - ../pipelines
    - ../jobs
    - ../setup
    - ../monitoring/dq_dashboard_setup.py


variables:
  stepright_catalog:
    description: Unity Catalog catalog this target reads/writes — same
      pipeline code, different catalog injected per environment.
    default: dev
  
  stepright_warehouse_id:
    description: SQL warehouse ID the DQ dashboard queries run against.
      No sensible default — set per target below.
    default: ade4a16e43c8682c

targets:
  dev:
    default: true
    workspace: 
      host: https://dbc-c5c5bb62-ac1e.cloud.databricks.com/

  uat:
    workspace:
      host: https://dbc-c5c5bb62-ac1e.cloud.databricks.com/
    variables:
      stepright_catalog: uat

  prod:
    workspace:
      host: https://dbc-f4aa3bf8-4b54.cloud.databricks.com/
    variables:
      stepright_catalog: prod
      stepright_warehouse_id: 87661d7fa3770e14










